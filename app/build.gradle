plugins { id 'com.android.application'; id 'com.google.gms.google-services' }
android {
 namespace 'com.pocketkhata.app'
 compileSdk 35
 defaultConfig { applicationId 'com.pocketkhata.app'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { release { minifyEnabled false } }
 testOptions {
  unitTests.includeAndroidResources = true
  unitTests.all {
   systemProperty 'user.home', rootProject.layout.buildDirectory.dir('test-home').get().asFile.absolutePath
   systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
   maxHeapSize = '1536m'
  }
 }
 lint { abortOnError true }
}
dependencies {
 implementation 'androidx.appcompat:appcompat:1.7.0'
 implementation 'androidx.activity:activity:1.9.3'
 implementation 'androidx.recyclerview:recyclerview:1.3.2'
 implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
 implementation 'com.google.android.material:material:1.12.0'
 implementation platform('com.google.firebase:firebase-bom:33.7.0')
 implementation 'com.google.firebase:firebase-auth'
 implementation 'com.google.firebase:firebase-database'
 implementation 'androidx.exifinterface:exifinterface:1.3.7'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
 testImplementation 'androidx.test:core:1.6.1'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
